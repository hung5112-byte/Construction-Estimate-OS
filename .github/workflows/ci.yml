name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff, rules pinned in pyproject.toml)
        run: ruff check docs/core docs/tests scripts

      - name: Domain-neutral check (RULE 2, must run from docs/)
        working-directory: docs
        run: bash scripts/dev/check-domain-neutral.sh

      - name: Test suite (no network, no LLM)
        run: pytest docs/tests -q

      - name: End-to-end smoke on the synthetic package (deterministic path)
        run: |
          ce-os --version
          ce-os estimate run docs/tests/fixtures/sample-set-prairie-creek --name "CI Prairie Creek" --type office-warehouse --city Plano --vault .
          ce-os estimate rom --type restaurant-ti --name "CI Pho 88" --sf 3200 --city Plano --field hood_lf=14 --vault .
          ce-os estimate eval --set docs/tests/fixtures/sample-set-prairie-creek --runs 1 --vault .
          ls 03-Outputs/evals
