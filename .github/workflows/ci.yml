name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check docs/core/ docs/tests/

      - name: Domain-neutral check (RULE 2)
        run: bash docs/scripts/dev/check-domain-neutral.sh

      - name: Unit tests
        run: pytest docs/tests/unit/ -v

      - name: Integration tests (mocked LLM)
        run: pytest docs/tests/integration/ -v

      - name: E2E tests (mocked)
        run: pytest docs/tests/e2e/test_b_npi_pilot_launch.py docs/tests/e2e/test_all_rules_verified.py -v
