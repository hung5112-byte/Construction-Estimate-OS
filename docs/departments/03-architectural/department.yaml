code: 03-architectural
name_local: Architectural Estimating
tier: 1
description: 'Takeoff and scope for the building envelope, interiors, openings and specialties from the A and I sheets and the schedules: roofing and insulation, storefront and cladding, partitions by wall type, ceilings, flooring, paint, doors/frames/hardware by mark, windows, toilet accessories, signage, elevators, equipment and casework. The lead speaks for the department.'
agents:
- architectural-lead
- envelope-estimator
- interiors-estimator
- openings-estimator
- specialties-equipment-estimator
default_speaker: architectural-lead
refs_folder: refs/
depends_on:
- 02-civil-structural
- 04-mep
debate_role:
