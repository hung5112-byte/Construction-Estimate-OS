code: 02-civil-structural
name_local: Civil & Structural Estimating
tier: 1
description: 'Takeoff and scope for sitework, concrete, masonry and structural steel from the C, L and S sheets and the geotechnical report: earthwork in bank cubic yards, utilities and paving, footings/slabs/tilt panels in CY with forms and rebar, steel tonnage and piece counts, CMU and brick. The lead speaks for the department.'
