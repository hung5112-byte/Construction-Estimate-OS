common_rfis:
- Is the furniture plan final?
- Are data and low-voltage systems by owner?
- Are conference-room AV needs included?
- Are existing RTUs/VAVs adequate?
- Are fire alarm or sprinkler changes needed?
- Is the building's after-hours HVAC and freight policy known?
common_exclusions:
- furniture, AV and data cabling
- landlord base-building work
- restroom modifications unless shown
- permit and impact fees unless stated
- hazardous materials abatement
- after-hours or weekend work unless stated
- hidden conditions behind existing finishes or below slab
- landlord-required work not shown
- low-voltage cabling, AV, security beyond raceway
- furniture, fixtures and equipment purchase (owner-furnished)
- utility company fees and service upgrades
risk_checklist:
- risk: Data / low-voltage scope gaps
  severity: high
  trade: electrical
  mitigation_exclusion: furniture, AV and data cabling
  rfi: Are data and low-voltage systems by owner?
- risk: Sound and privacy expectations
  severity: medium
  trade: framing-drywall
  mitigation_exclusion: ''
  rfi: Are acoustic requirements defined for offices and conference rooms?
- risk: HVAC balancing with new partitions
  severity: medium
  trade: hvac
  mitigation_exclusion: ''
  rfi: Are existing units adequate?
- risk: Landlord requirements and building rules
  severity: medium
  trade: general-conditions
  mitigation_exclusion: landlord base-building work
  rfi: ''
