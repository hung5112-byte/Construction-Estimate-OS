intake_fields:
  gross_sf:
    required: true
  lot_sf:
    default_ratio_of_gross: 4.0
    note: site area assumed 4 × building area
  storefront_lf:
    default_ratio_of_gross: 0.02
    note: storefront length assumed 2% of gross SF in LF
  restroom_count:
    default: 2
    note: two restrooms assumed
general_conditions:
