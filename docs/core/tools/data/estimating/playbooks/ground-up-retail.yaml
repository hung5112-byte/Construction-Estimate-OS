common_rfis:
- Are civil plans and the geotechnical report available?
- Are utilities (water, sanitary, storm, power, gas) confirmed at the property line?
- Are fire lane and hydrant requirements confirmed?
- Is the structural system (steel, PEMB, tilt) decided?
- Are landscape and irrigation included?
- Are utility company fees included or excluded?
- Are offsite improvements required?
common_exclusions:
- offsite improvements and utility company fees
- landscape and irrigation unless shown
- unsuitable soils and rock
- tenant finish-out beyond shell
- impact fees
risk_checklist:
- risk: Utility availability and capacity
  severity: high
  trade: site-civil
  mitigation_exclusion: offsite improvements and utility company fees
  rfi: Are utilities confirmed at the property line?
- risk: Unsuitable soils / geotech
  severity: high
  trade: concrete-slab
  mitigation_exclusion: unsuitable soils and rock
  rfi: Is the geotechnical report available?
- risk: Fire lane and hydrant requirements
  severity: high
  trade: site-civil
  mitigation_exclusion: ''
  rfi: Are fire lane and hydrant requirements confirmed?
- risk: Long-lead steel / PEMB
  severity: medium
  trade: structural
  mitigation_exclusion: ''
  rfi: Is the structural system decided?
- risk: Drainage and detention
  severity: medium
  trade: site-civil
  mitigation_exclusion: ''
  rfi: Is detention required?
- risk: Permit and platting delays
  severity: medium
  trade: general-conditions
  mitigation_exclusion: ''
  rfi: ''
