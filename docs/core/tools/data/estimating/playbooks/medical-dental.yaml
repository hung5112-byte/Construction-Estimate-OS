common_rfis:
- Are medical/dental equipment cut sheets and utility requirements available?
- Are specialty utilities (vacuum, air, gas) required?
- Are accessibility (TAS/ADA) requirements shown?
- Are plumbing fixture and hand-sink counts final?
- Are HVAC zones and exhaust requirements defined?
- Are fire alarm or sprinkler changes needed?
common_exclusions:
- medical and dental equipment purchase and installation
- medical gas certification
- x-ray shielding unless shown
- TDLR registration and inspection fees
- permit and impact fees unless stated
- hazardous materials abatement
- after-hours or weekend work unless stated
- hidden conditions behind existing finishes or below slab
- landlord-required work not shown
- low-voltage cabling, AV, security beyond raceway
- furniture, fixtures and equipment purchase (owner-furnished)
- utility company fees and service upgrades
risk_checklist:
- risk: Accessibility / TAS review
  severity: high
  trade: general-conditions
  mitigation_exclusion: ''
  rfi: Are accessibility requirements shown and has TAS review been requested?
- risk: Equipment utility requirements unknown
  severity: high
  trade: plumbing
  mitigation_exclusion: specialty utilities beyond the allowance carried
  rfi: Are equipment cut sheets available?
- risk: Infection-control finish requirements
  severity: medium
  trade: flooring
  mitigation_exclusion: ''
  rfi: Are finish specifications for clinical areas defined?
- risk: Inspection requirements (health, radiology)
  severity: medium
  trade: general-conditions
  mitigation_exclusion: ''
  rfi: ''
- risk: Owner equipment delays
  severity: medium
  trade: millwork
  mitigation_exclusion: ''
  rfi: ''
