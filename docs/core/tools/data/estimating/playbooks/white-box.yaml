common_rfis:
- What is the landlord-required white-box condition (work letter)?
- Are restrooms included?
- Is the HVAC unit existing and adequate?
- Is flooring included or excluded?
- Are sprinkler and fire alarm changes required by code for the shell?
common_exclusions:
- flooring unless stated
- tenant-specific improvements
- HVAC unit replacement
- storefront work
- permit and impact fees unless stated
- hazardous materials abatement
- after-hours or weekend work unless stated
- hidden conditions behind existing finishes or below slab
- landlord-required work not shown
- low-voltage cabling, AV, security beyond raceway
- furniture, fixtures and equipment purchase (owner-furnished)
- utility company fees and service upgrades
risk_checklist:
- risk: Unclear landlord criteria
  severity: high
  trade: general-conditions
  mitigation_exclusion: items beyond the landlord work letter
  rfi: What is the landlord-required white-box condition?
- risk: Scope boundary landlord vs tenant
  severity: high
  trade: general-conditions
  mitigation_exclusion: tenant-specific improvements
  rfi: Which items are tenant scope?
- risk: Utility capacity
  severity: medium
  trade: electrical
  mitigation_exclusion: ''
  rfi: Are service sizes confirmed?
- risk: Life-safety requirements for the shell
  severity: medium
  trade: fire-sprinkler
  mitigation_exclusion: ''
  rfi: Are code-required changes identified?
