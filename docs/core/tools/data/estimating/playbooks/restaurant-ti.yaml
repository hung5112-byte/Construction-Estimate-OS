common_rfis:
- Is the final kitchen equipment schedule with cut sheets available?
- Are hood and fire-suppression drawings available, and is make-up air existing or new?
- Is the grease interceptor existing, approved and adequately sized?
- Are gas service and electrical service capacities confirmed?
- Are the existing RTUs adequate for the kitchen heat load?
- Are health department comments available?
- Which items are owner-furnished, and who installs them?
common_exclusions:
- kitchen equipment purchase
- grease interceptor replacement
- RTU replacement and make-up air unless shown
- electrical service upgrade
- gas meter upgrade
- permit and impact fees unless stated
- hazardous materials abatement
- after-hours or weekend work unless stated
- hidden conditions behind existing finishes or below slab
- landlord-required work not shown
- low-voltage cabling, AV, security beyond raceway
- furniture, fixtures and equipment purchase (owner-furnished)
- utility company fees and service upgrades
risk_checklist:
- risk: Hood / make-up air
  severity: high
  trade: hood-kitchen
  mitigation_exclusion: make-up air unit unless shown on drawings
  rfi: Is make-up air existing or new?
- risk: Grease interceptor capacity and routing
  severity: high
  trade: plumbing
  mitigation_exclusion: grease interceptor replacement
  rfi: Is the grease interceptor existing, approved and adequately sized?
- risk: Gas and electrical service capacity
  severity: high
  trade: electrical
  mitigation_exclusion: electrical service and gas meter upgrades
  rfi: Are gas and electrical service capacities confirmed?
- risk: RTU capacity for kitchen heat load
  severity: high
  trade: hvac
  mitigation_exclusion: RTU replacement
  rfi: Are the existing RTUs adequate for the kitchen heat load?
- risk: Health department and Fire Marshal review
  severity: medium
  trade: general-conditions
  mitigation_exclusion: ''
  rfi: Are health department comments available?
- risk: Slab trenching for plumbing relocations
  severity: medium
  trade: plumbing
  mitigation_exclusion: ''
  rfi: Are existing under-slab line locations known?
- risk: Owner-furnished equipment timing
  severity: medium
  trade: hood-kitchen
  mitigation_exclusion: ''
  rfi: Which items are owner-furnished?
