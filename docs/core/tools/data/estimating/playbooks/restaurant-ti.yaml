    required: true
  kitchen_sf:
    default_ratio_of_gross: 0.3
    note: kitchen assumed 30% of gross when not given
  hood_lf:
    default: 12
    note: one 12 LF Type I hood assumed
  fixture_count:
    default: 8
    note: 8 plumbing fixtures assumed (restrooms + kitchen sinks)
  restroom_count:
    default: 2
    note: two restrooms assumed
  existing_sprinklered:
    default: 1
    note: building assumed sprinklered (1 = yes)
