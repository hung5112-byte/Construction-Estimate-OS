common_rfis:
- Are fixture and lighting plans final?
- Are landlord criteria and the landlord work letter available?
- Are storefront changes included?
- Are low-voltage and security systems by owner?
- Are after-hours rules imposed by the center?
common_exclusions:
- storefront and signage unless shown
- fixtures and merchandising equipment purchase
- low-voltage, security and POS systems
- landlord work-letter items
- permit and impact fees unless stated
- hazardous materials abatement
- after-hours or weekend work unless stated
- hidden conditions behind existing finishes or below slab
- landlord-required work not shown
- low-voltage cabling, AV, security beyond raceway
- furniture, fixtures and equipment purchase (owner-furnished)
- utility company fees and service upgrades
risk_checklist:
- risk: Landlord criteria and work letter
  severity: high
  trade: general-conditions
  mitigation_exclusion: landlord work-letter items
  rfi: Are landlord criteria available?
- risk: After-hours rules in the center
  severity: medium
  trade: general-conditions
  mitigation_exclusion: after-hours premium beyond stated hours
  rfi: Are after-hours rules imposed?
- risk: Fixture delivery timing
  severity: medium
  trade: millwork
  mitigation_exclusion: ''
  rfi: ''
- risk: Low-voltage scope gaps
  severity: medium
  trade: electrical
  mitigation_exclusion: low-voltage, security and POS systems
  rfi: Are low-voltage systems by owner?
