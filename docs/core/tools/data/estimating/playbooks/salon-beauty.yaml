common_rfis:
- How many shampoo bowls and styling stations?
- Are chairs and stations owner-furnished, and who installs them?
- Is water heater capacity adequate?
- Are floor penetrations for drains allowed by the landlord?
- Is existing HVAC capacity adequate?
- Are electrical loads for dryers confirmed?
common_exclusions:
- styling stations, chairs and equipment purchase
- water heater upgrade beyond capacity shown
- landlord-required corridor or storefront work
- permit and impact fees unless stated
- hazardous materials abatement
- after-hours or weekend work unless stated
- hidden conditions behind existing finishes or below slab
- landlord-required work not shown
- low-voltage cabling, AV, security beyond raceway
- furniture, fixtures and equipment purchase (owner-furnished)
- utility company fees and service upgrades
risk_checklist:
- risk: Under-slab trenching for bowl drains
  severity: high
  trade: plumbing
  mitigation_exclusion: slab trenching beyond 40 LF
  rfi: Are floor penetrations and drain routes confirmed?
- risk: Water heater capacity
  severity: high
  trade: plumbing
  mitigation_exclusion: water heater upgrade beyond capacity shown
  rfi: Is water heater capacity adequate for the bowl count?
- risk: Electrical load for dryers and stations
  severity: medium
  trade: electrical
  mitigation_exclusion: ''
  rfi: Are electrical loads confirmed?
- risk: Venting limitations
  severity: medium
  trade: plumbing
  mitigation_exclusion: ''
  rfi: Are vent routes available?
- risk: Finish expectations vs budget
  severity: low
  trade: paint-finish
  mitigation_exclusion: ''
  rfi: ''
