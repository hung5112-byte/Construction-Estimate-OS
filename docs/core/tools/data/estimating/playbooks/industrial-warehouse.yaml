intake_fields:
  gross_sf:
    required: true
  office_sf:
    default_ratio_of_gross: 0.1
    note: office finish-out assumed 10% of gross
  dock_doors:
    default_ratio_of_gross: 0.0002
    note: one dock position per 5,000 SF assumed
  clear_height_ft:
    default: 28
    note: 28 ft clear assumed
  lot_sf:
    default_ratio_of_gross: 3.0
    note: site area assumed 3 × building area
  esfr:
    default: 1
    note: ESFR sprinklers assumed (1 = yes)
general_conditions:
  superintendent_fte: 1.0
  pm_fte: 0.5
  pe_fte: 0.5
  safety_fte: 0.5
  trailer: true
  toilets: 2
  dumpsters_per_month: 3
  fence: true
