common_rfis:
- Is the building PEMB, tilt-wall or steel frame?
- Are dock positions and door sizes final?
- Is ESFR required for the storage classification?
- Are storage and racking plans available?
- Are power requirements known?
- Are office areas included?
- Is site/civil complete and is the geotech available?
common_exclusions:
- racking and material-handling equipment
- process power beyond the service shown
- offsite improvements and utility company fees
- unsuitable soils and rock
- impact fees
risk_checklist:
- risk: Fire protection classification (ESFR, pump)
  severity: high
  trade: fire-sprinkler
  mitigation_exclusion: fire pump unless required by the flow test
  rfi: Is ESFR required for the storage classification?
- risk: Slab specification vs racking loads
  severity: high
  trade: concrete-slab
  mitigation_exclusion: slab upgrades beyond 6in
  rfi: Are storage and racking plans available?
- risk: Electrical service size
  severity: high
  trade: electrical
  mitigation_exclusion: process power beyond the service shown
  rfi: Are power requirements known?
- risk: Long-lead steel and tilt panel sub capacity
  severity: medium
  trade: structural
  mitigation_exclusion: ''
  rfi: Is the structural system decided?
- risk: Drainage and detention
  severity: medium
  trade: site-civil
  mitigation_exclusion: ''
  rfi: ''
- risk: Utility availability
  severity: medium
  trade: site-civil
  mitigation_exclusion: offsite improvements and utility company fees
  rfi: Are utilities confirmed?
