<text x="1900.0" y="344.0" font-size="18" font-weight="normal" text-anchor="start">1. EXTERIOR WALLS: 8" CMU, GROUTED SOLID; BRICK VENEER ON OFFICE (WEST 100 LF + NORTH 40 LF x 14'-0").</text>
<text x="1900.0" y="376.0" font-size="18" font-weight="normal" text-anchor="start">2. WAREHOUSE CMU EXPOSED, PAINTED; PARAPET COPING PREFINISHED ALUMINUM 440 LF.</text>
<text x="1900.0" y="408.0" font-size="18" font-weight="normal" text-anchor="start">3. STOREFRONT: CLEAR ANODIZED ALUMINUM, 1" INSULATED LOW-E GLASS; ENTRANCE 101 PAIR 6'-0" x 7'-0".</text>
<text x="1900.0" y="440.0" font-size="18" font-weight="normal" text-anchor="start">4. WINDOWS W1: 4'-0" x 5'-0" FIXED ALUMINUM, SILL AT 3'-0" AFF, QTY 10.</text>
<text x="1900.0" y="472.0" font-size="18" font-weight="normal" text-anchor="start">5. OVERHEAD DOORS OH-1, OH-2: 12'-0" x 14'-0" INSULATED SECTIONAL, MOTOR OPERATED.</text>
<text x="1900.0" y="504.0" font-size="18" font-weight="normal" text-anchor="start">6. ROOF: TPO, 1/4" PER FT SLOPE TO INTERNAL DRAINS (4) WITH OVERFLOWS (4).</text>
