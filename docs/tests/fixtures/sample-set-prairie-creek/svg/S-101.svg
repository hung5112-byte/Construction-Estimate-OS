<text x="2140.0" y="300.0" font-size="24" font-weight="bold" text-anchor="start">STRUCTURAL GENERAL NOTES</text>
<text x="2140.0" y="344.0" font-size="17" font-weight="normal" text-anchor="start">1. CODES: IBC 2021; ASCE 7-22. ROOF LL 20 PSF; WIND 115 MPH EXP C; SEISMIC SDC A.</text>
<text x="2140.0" y="376.0" font-size="17" font-weight="normal" text-anchor="start">2. CONCRETE: f'c = 4,000 PSI AT 28 DAYS ALL FOOTINGS AND SLABS; 3,000 PSI FILL.</text>
<text x="2140.0" y="408.0" font-size="17" font-weight="normal" text-anchor="start">3. REINFORCING: ASTM A615 GR 60. WWM ASTM A1064.</text>
<text x="2140.0" y="440.0" font-size="17" font-weight="normal" text-anchor="start">4. CMU: ASTM C90, f'm = 2,000 PSI, TYPE S MORTAR, GROUT ALL CELLS SOLID; #5 @ 32" OC VERT.</text>
<text x="2140.0" y="472.0" font-size="17" font-weight="normal" text-anchor="start">5. STRUCTURAL STEEL: W-SHAPES ASTM A992; HSS ASTM A500 GR C; JOISTS SJI K-SERIES; DECK ASTM A653.</text>
<text x="2140.0" y="504.0" font-size="17" font-weight="normal" text-anchor="start">6. BEARING: 3,000 PSF ALLOWABLE PER GEOTECH REPORT (TERRA-TEX 26-1188); FOOTINGS 24" MIN BELOW GRADE.</text>
<text x="2140.0" y="536.0" font-size="17" font-weight="normal" text-anchor="start">7. SPECIAL INSPECTIONS PER IBC CH. 17: CONCRETE, MASONRY, STEEL BOLTING/WELDING — SEE 01 45 00.</text>
<text x="2140.0" y="568.0" font-size="17" font-weight="normal" text-anchor="start">8. SLAB CONTROL JOINTS AT 12'-0" OC MAX EACH WAY, SAW CUT 1/4 DEPTH.</text>
