<text x="300.0" y="1046.0" font-size="20" font-weight="normal" text-anchor="start">1. DO NOT SCALE DRAWINGS. FIGURED DIMENSIONS GOVERN.</text>
<text x="300.0" y="1080.0" font-size="20" font-weight="normal" text-anchor="start">2. SCHEDULES GOVERN OVER PLANS WHERE THEY DIFFER; NOTIFY THE ARCHITECT OF CONFLICTS BY PRE-BID RFI.</text>
<text x="300.0" y="1114.0" font-size="20" font-weight="normal" text-anchor="start">3. ALL DIMENSIONS ARE TO FACE OF CMU OR FACE OF STUD UNLESS NOTED.</text>
<text x="300.0" y="1148.0" font-size="20" font-weight="normal" text-anchor="start">4. EXTERIOR WALLS: 8" CMU, GROUTED SOLID, WITH BRICK VENEER AT OFFICE; SEE A-201 AND SPEC 04 22 00.</text>
<text x="300.0" y="1182.0" font-size="20" font-weight="normal" text-anchor="start">5. INTERIOR PARTITIONS: TYPE P1 3-5/8" MTL STUD 16" OC, 5/8" GWB EACH SIDE TO DECK UNLESS NOTED.</text>
<text x="300.0" y="1216.0" font-size="20" font-weight="normal" text-anchor="start">6. ROOF: MECHANICALLY FASTENED 60-MIL TPO OVER POLYISO (R-30 AVG), TAPERED CRICKETS; 20-YEAR NDL WARRANTY.</text>
<text x="300.0" y="1250.0" font-size="20" font-weight="normal" text-anchor="start">7. SPRINKLER SYSTEM IS DESIGN-BUILD BY THE FIRE PROTECTION SUBCONTRACTOR PER NFPA 13.</text>
<text x="300.0" y="1284.0" font-size="20" font-weight="normal" text-anchor="start">8. SIGNAGE ALLOWANCE $25,000 — SEE SPEC 01 21 00.</text>
