[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "construction-estimate-os"
version = "0.2.0"
description = "Construction Estimate OS — an AI preconstruction/estimating department for commercial general contractors: agents read drawings and specifications, take off quantities with sheet-level provenance, price against a cost library, review the estimate, and hand the Chief Estimator a bid-ready report (.docx/.xlsx)"
authors = [{ name = "Brian H. Doan" }]
license = "Apache-2.0"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "tavily-python>=0.5.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "gitpython>=3.1.40",
    "mcp>=1.0.0,<2",
    "sqlite-vec==0.1.9",
    "fastembed>=0.8.0",
    "markitdown[docx,pptx,pdf]>=0.1.6",
    "ezdxf>=1.4.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ce-os = "core.cli:main"
ce-os-mcp = "core.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["docs/core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI baseline (ruff defaults, pinned explicitly so local runs match CI whatever the user-level config says).
# Broader families (I, UP, DTZ, S, RUF, ...) are advisory: `ruff check --select ALL docs/core/estimating`.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["docs/tests"]
