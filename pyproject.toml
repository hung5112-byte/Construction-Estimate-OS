[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bd-business-os"
version = "0.2.0"
description = "AI Operating System for a hardware division — a Department Head + AI departments debate to decide and produce docs aligned with US federal + Texas law"
authors = [{ name = "Brian H. Doan" }]
license = "Apache-2.0"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "tavily-python>=0.5.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "gitpython>=3.1.40",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
bd-os = "core.cli:main"
bd-os-mcp = "core.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["docs/core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["docs/tests"]
